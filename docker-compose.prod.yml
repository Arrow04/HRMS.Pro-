version: '3.8'

services:
  # PostgreSQL Database with replication
  postgres-primary:
    image: postgres:15-alpine
    container_name: hrms-postgres-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hrms_db
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    command: postgres -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c shared_buffers=256MB -c effective_cache_size=768MB -c maintenance_work_mem=64MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100 -c random_page_cost=1.1 -c effective_io_concurrency=200 -c work_mem=4MB -c min_wal_size=1GB -c max_wal_size=4GB -c max_worker_processes=4 -c max_parallel_workers_per_gather=2 -c max_parallel_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-replica:
    image: postgres:15-alpine
    container_name: hrms-postgres-replica
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hrms_db
      PGUSER: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    command: |
      bash -c "
      until pg_isready -h postgres-primary -U replicator; do sleep 1; done
      pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -P -W -R
      echo 'standby_mode = on' >> /var/lib/postgresql/data/recovery.conf
      echo 'primary_conninfo = host=postgres-primary port=5432 user=replicator password=${REPLICATION_PASSWORD}' >> /var/lib/postgresql/data/recovery.conf
      postgres
      "
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - hrms-network
    restart: unless-stopped

  # Redis Cluster for distributed caching
  redis-node-1:
    image: redis:7-alpine
    container_name: hrms-redis-1
    ports:
      - "7001:6379"
    volumes:
      - redis_node1_data:/data
    command: redis-server --appendonly yes --port 6379
    networks:
      - hrms-network
    restart: unless-stopped

  redis-node-2:
    image: redis:7-alpine
    container_name: hrms-redis-2
    ports:
      - "7002:6379"
    volumes:
      - redis_node2_data:/data
    command: redis-server --appendonly yes --port 6379
    networks:
      - hrms-network
    restart: unless-stopped

  redis-node-3:
    image: redis:7-alpine
    container_name: hrms-redis-3
    ports:
      - "7003:6379"
    volumes:
      - redis_node3_data:/data
    command: redis-server --appendonly yes --port 6379
    networks:
      - hrms-network
    restart: unless-stopped

  # HRMS Backend API with multiple replicas
  api:
    build:
      context: ./hrms_backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres-primary:5432/hrms_db
      READ_REPLICA_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres-replica:5432/hrms_db
      REDIS_URL: redis://redis-node-1:6379/0
      REDIS_CLUSTER_URLS: redis://redis-node-1:6379,redis://redis-node-2:6379,redis://redis-node-3:6379
      LOG_LEVEL: INFO
      APP_ENV: production
      ENABLE_CIRCUIT_BREAKER: "true"
      ENABLE_ASYNC_ENDPOINTS: "true"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-node-1:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - hrms-network
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M

  # HRMS React Web Frontend
  frontend:
    build:
      context: ./hrms_react_web
      dockerfile: Dockerfile
    container_name: hrms-frontend
    networks:
      - hrms-network
    restart: unless-stopped
    depends_on:
      - api

  # Nginx API Gateway & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hrms-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - hrms-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: hrms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./hrms_backend/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - hrms-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: hrms-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./hrms_backend/grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./hrms_backend/grafana-datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - hrms-network
    restart: unless-stopped

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hrms-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - hrms-network
    restart: unless-stopped

  # Elasticsearch for log aggregation
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: hrms-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.http.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - hrms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kibana for log visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: hrms-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elastic:${ELASTIC_PASSWORD}@elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - hrms-network
    restart: unless-stopped

volumes:
  postgres_primary_data:
  postgres_replica_data:
  redis_node1_data:
  redis_node2_data:
  redis_node3_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
  elasticsearch_data:

networks:
  hrms-network:
    driver: bridge
