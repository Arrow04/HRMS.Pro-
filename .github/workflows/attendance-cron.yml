name: Attendance Auto-Close Cron

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  auto-close:
    runs-on: ubuntu-latest
    steps:
      - name: Run attendance auto-close
        run: |
          curl -s -X POST https://hrms-api-8yv3.onrender.com/api/cron/auto-close-attendance \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" || true
