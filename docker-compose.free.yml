version: '3.8'

services:
  # PostgreSQL Database (Tuned for 1GB RAM)
  postgres-primary:
    image: postgres:15-alpine
    container_name: hrms-postgres-free
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hrms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_free_data:/var/lib/postgresql/data
    # Memory tuning for 1GB RAM instance:
    # shared_buffers = 128MB, effective_cache_size = 256MB, work_mem = 4MB
    command: postgres -c shared_buffers=128MB -c effective_cache_size=256MB -c work_mem=4MB -c maintenance_work_mem=32MB -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hrms-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 350M

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: hrms-redis-free
    ports:
      - "6379:6379"
    volumes:
      - redis_free_data:/data
    command: redis-server --appendonly yes --port 6379 --maxmemory 100mb --maxmemory-policy allkeys-lru
    networks:
      - hrms-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 150M

  # HRMS Backend API (Single Replica)
  api:
    build:
      context: ./hrms_backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres-primary:5432/hrms_db
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      APP_ENV: production
      ENABLE_CIRCUIT_BREAKER: "false" # Disabled to save memory
      ENABLE_ASYNC_ENDPOINTS: "true"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - hrms-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 350M

  # HRMS React Web Frontend
  frontend:
    build:
      context: ./hrms_react_web
      dockerfile: Dockerfile
    container_name: hrms-frontend-free
    networks:
      - hrms-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 50M # Nginx serving static files is very lightweight

  # Nginx API Gateway & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: hrms-nginx-free
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    networks:
      - hrms-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 50M

volumes:
  postgres_free_data:
  redis_free_data:

networks:
  hrms-network:
    driver: bridge
