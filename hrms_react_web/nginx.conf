server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Security Headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://hrms-api-8yv3.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

  # Gzip Settings
  gzip on;
  gzip_vary on;
  gzip_min_length 10240;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
  gzip_disable "MSIE [1-6]\.";

  # Cache static assets for 1 year (Vite hashes filenames)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, no-transform";
  }

  location / {
    try_files $uri /index.html;
    # Prevent caching of index.html to ensure users always get the latest version
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
}
